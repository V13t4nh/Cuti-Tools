<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CUTI — Decision Terminal</title>
    <script>
      (() => {
        const root = document.documentElement
        let savedTheme = null
        try { savedTheme = window.localStorage.getItem('cuti-theme') } catch { /* storage can be unavailable */ }
        const isSystem = !savedTheme || savedTheme === 'system'
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = isSystem ? (systemDark ? 'dark' : 'light') : (savedTheme === 'dark' ? 'dark' : 'light')
        root.dataset.theme = theme
        root.dataset.themeMode = isSystem ? 'system' : theme
        root.style.colorScheme = theme
      })()
    </script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
